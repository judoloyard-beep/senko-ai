
<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#0b0d14">
  <title>Senko AI</title>

  <link rel="stylesheet"
    href="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.11.1/styles/github-dark.min.css">

  <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.11.1/highlight.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/dompurify@3.2.6/dist/purify.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>
    * { box-sizing: border-box; }

    body {
      margin: 0;
      height: 100dvh;
      display: flex;
      flex-direction: column;
      background: #0b0d14;
      color: #fff;
      font-family: Arial, sans-serif;
    }

    button {
      border: 0;
      border-radius: 10px;
      padding: 11px 13px;
      background: #7868ff;
      color: white;
      font-weight: bold;
      cursor: pointer;
    }

    button:disabled {
      opacity: .5;
      cursor: not-allowed;
    }

    header {
      padding: 13px;
      background: #121522;
      border-bottom: 1px solid #25283a;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
    }

    .logo {
      font-size: 20px;
      font-weight: bold;
      white-space: nowrap;
    }

    .logo span, .welcome span { color: #9889ff; }

    .header-buttons {
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .header-buttons button {
      padding: 10px;
      font-size: 12px;
    }

    #accountPanel, #historyPanel {
      display: none;
      padding: 14px;
      background: #121522;
      border-bottom: 1px solid #25283a;
    }

    #accountPanel.show, #historyPanel.show { display: block; }

    #accountPanel input {
      width: 100%;
      padding: 12px;
      margin: 5px 0;
      background: #1c2030;
      border: 1px solid #34384c;
      border-radius: 9px;
      color: white;
    }

    #accountStatus, #authMessage {
      color: #c2baff;
      font-size: 13px;
    }

    #accountStatus { margin-bottom: 10px; }
    #authMessage { margin-top: 9px; }

    #logoutBtn { background: #a33c50; }

    #historyPanel {
      max-height: 230px;
      overflow-y: auto;
    }

    .history-title {
      color: #aaa;
      font-size: 12px;
      margin-bottom: 10px;
    }

    .history-item {
      display: flex;
      gap: 7px;
      margin-bottom: 7px;
    }

    .history-open {
      flex: 1;
      text-align: left;
      background: #202438;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .history-delete { background: #a33c50; }

    #chat {
      flex: 1;
      min-height: 0;
      overflow-y: auto;
      padding: 16px;
      display: flex;
      flex-direction: column;
      gap: 14px;
      scroll-behavior: smooth;
    }

    .welcome {
      margin: auto;
      text-align: center;
      color: #aaa;
      max-width: 290px;
    }

    .welcome h2 { color: white; }

    .msg {
      padding: 13px 15px;
      border-radius: 15px;
      max-width: 92%;
      line-height: 1.6;
      overflow-wrap: anywhere;
    }

    .user {
      background: #6254dc;
      align-self: flex-end;
    }

    .ai {
      background: #191d2b;
      align-self: flex-start;
    }

    .msg-content p { margin: 4px 0 12px; }

    .msg-content ul, .msg-content ol {
      padding-left: 22px;
    }

    .msg-content pre {
      background: #080a10;
      padding: 12px;
      border-radius: 10px;
      overflow-x: auto;
      max-width: 100%;
    }

    .msg-content pre code {
      font-size: 13px;
      white-space: pre;
    }

    .msg-content :not(pre) > code {
      background: #292d43;
      padding: 3px 6px;
      border-radius: 5px;
    }

    .msg-content a {
      color: #b6aaff;
      overflow-wrap: anywhere;
    }

    .msg-image {
      display: block;
      max-width: 230px;
      max-height: 230px;
      object-fit: contain;
      border-radius: 10px;
      margin-top: 8px;
    }

    .typing {
      color: #aaa;
      font-size: 13px;
      animation: pulse 1s infinite alternate;
    }

    @keyframes pulse {
      to { opacity: .4; }
    }

    #previewArea {
      display: none;
      padding: 10px;
      background: #121522;
      align-items: center;
      gap: 10px;
    }

    #previewArea.show { display: flex; }

    #previewImage {
      width: 65px;
      height: 65px;
      object-fit: cover;
      border-radius: 9px;
    }

    #removeImage { background: #a33c50; }

    footer {
      padding: 10px;
      display: flex;
      gap: 7px;
      align-items: center;
      background: #121522;
      border-top: 1px solid #25283a;
    }

    #input {
      flex: 1;
      min-width: 0;
      padding: 13px;
      border-radius: 11px;
      border: 1px solid #34384c;
      background: #1c2030;
      color: white;
      font-size: 15px;
      outline: none;
    }

    #input:focus { border-color: #7868ff; }

    #imageBtn {
      background: #292d43;
      font-size: 18px;
      padding: 11px;
    }

    #send { padding: 12px; }

    .small-note {
      color: #888;
      font-size: 11px;
      text-align: center;
      padding: 5px;
      background: #121522;
    }

    @media (max-width: 380px) {
      .logo { font-size: 16px; }
      .header-buttons button { padding: 9px 7px; }
      #chat { padding: 10px; }
    }
  </style>
</head>

<body>

  <header>
    <div class="logo">✦ <span>SENKO</span>AI</div>

    <div class="header-buttons">
      <button id="accountBtn" type="button">Akun</button>
      <button id="historyBtn" type="button">☰</button>
      <button id="newChatBtn" type="button">＋ Chat</button>
    </div>
  </header>

  <section id="accountPanel">
    <div id="accountStatus">Memeriksa akun...</div>

    <div id="authForm">
      <input id="usernameInput"
        placeholder="Username"
        autocomplete="username">

      <input id="emailInput"
        type="email"
        placeholder="Email"
        autocomplete="email">

      <input id="passwordInput"
        type="password"
        placeholder="Password minimal 6 karakter"
        autocomplete="current-password">

      <div class="header-buttons">
        <button id="registerBtn" type="button">Daftar</button>
        <button id="loginBtn" type="button">Login</button>
      </div>
    </div>

    <button id="logoutBtn" type="button" style="display:none">
      Logout
    </button>

    <div id="authMessage"></div>
  </section>

  <section id="historyPanel">
    <div class="history-title">RIWAYAT PERCAKAPAN</div>
    <div id="historyList"></div>
  </section>

  <main id="chat">
    <div class="welcome">
      <h2>✦ SENKO <span>AI</span></h2>
      <p>halo kaka! ada yang bisa senko bantu?</p>
    </div>
  </main>

  <div id="previewArea">
    <img id="previewImage" alt="Preview gambar">
    <button id="removeImage" type="button">✕</button>
  </div>

  <footer>
    <button id="imageBtn" type="button" disabled>📎</button>

    <input id="imageInput"
      type="file"
      accept="image/jpeg,image/png,image/webp"
      hidden>

    <input id="cameraInput"
      type="file"
      accept="image/jpeg,image/png,image/webp"
      capture="environment"
      hidden>

    <input id="input"
      placeholder="Ketik pesan..."
      autocomplete="off">

    <button id="send" type="button">Kirim</button>
  </footer>

  <div class="small-note">
    Senko AI • Your personal AI assistant
  </div>

<script>
"use strict";

// ==================================
// KONFIGURASI
// ==================================

const SUPABASE_URL =
  "https://mtgfciwnuxaxbjoencvg.supabase.co";

const SUPABASE_KEY =
  "sb_publishable_DLnbdI8iZt9uqGcUwViHMw_o-8XSjPi";

const $ = id => document.getElementById(id);

function createId() {
  if (window.crypto && crypto.randomUUID) {
    return crypto.randomUUID();
  }

  return "xxxxxxxx-xxxx-4xxx-yxxx-xxxxxxxxxxxx".replace(
    /[xy]/g,
    char => {
      const random = Math.random() * 16 | 0;
      const value = char === "x" ? random : (random & 3 | 8);
      return value.toString(16);
    }
  );
}

// ==================================
// ELEMENT
// ==================================

const chat = $("chat");
const input = $("input");
const send = $("send");

const accountPanel = $("accountPanel");
const historyPanel = $("historyPanel");

const accountStatus = $("accountStatus");
const authMessage = $("authMessage");
const authForm = $("authForm");
const logoutBtn = $("logoutBtn");

const imageBtn = $("imageBtn");
const imageInput = $("imageInput");
const cameraInput = $("cameraInput");

const previewArea = $("previewArea");
const previewImage = $("previewImage");

const historyList = $("historyList");

// ==================================
// STATE
// ==================================

let supabaseClient = null;
let currentUser = null;
let authReady = false;

let selectedImage = null;
let selectedMimeType = null;

let conversations = [];
let activeChatId = null;
let activeStorageKey = null;

let sending = false;

const temporaryImages = new Map();

let guestId = localStorage.getItem("senko_user_id");

if (!guestId || !/^[0-9a-f-]{36}$/i.test(guestId)) {
  guestId = createId();
  localStorage.setItem("senko_user_id", guestId);
}

// ==================================
// STORAGE
// ==================================

function getActiveChat() {
  return conversations.find(item => item.id === activeChatId);
}

function saveChats() {
  if (!activeStorageKey) return;

  try {
    const lightweight = conversations.map(conversation => ({
      ...conversation,
      messages: conversation.messages.map(message => ({
        id: message.id,
        type: message.type,
        text: message.text || ""
      }))
    }));

    localStorage.setItem(
      activeStorageKey,
      JSON.stringify(lightweight)
    );
  } catch (error) {
    console.error("Storage error:", error);
    authMessage.textContent = "Penyimpanan riwayat gagal.";
  }
}

function loadChats() {
  activeStorageKey = currentUser
    ? "senko_chats_user_" + currentUser.id
    : "senko_chats_guest";

  try {
    const stored = JSON.parse(
      localStorage.getItem(activeStorageKey) || "[]"
    );

    conversations = Array.isArray(stored) ? stored : [];
  } catch (error) {
    console.error("Load chat error:", error);
    conversations = [];
  }

  conversations.sort(
    (a, b) => (b.updatedAt || 0) - (a.updatedAt || 0)
  );

  activeChatId = conversations[0]?.id || null;

  if (!activeChatId) {
    createNewChat();
  } else {
    renderMessages();
    renderHistory();
  }
}

// ==================================
// CHAT MANAGEMENT
// ==================================

function createNewChat() {
  const conversation = {
    id: createId(),
    title: "Percakapan baru",
    updatedAt: Date.now(),
    messages: []
  };

  conversations.unshift(conversation);
  activeChatId = conversation.id;

  saveChats();
  renderMessages();
  renderHistory();

  historyPanel.classList.remove("show");
}

function renderMessages() {
  chat.innerHTML = "";

  const conversation = getActiveChat();
  if (!conversation) return;

  if (!conversation.messages.length) {
    const welcome = document.createElement("div");
    welcome.className = "welcome";
    welcome.innerHTML =
      "<h2>✦ SENKO <span>AI</span></h2>" +
      "<p>halo kaka! ada yang bisa senko bantu?</p>";

    chat.appendChild(welcome);
    return;
  }

  conversation.messages.forEach(message => {
    const el = document.createElement("div");
    el.className = "msg " + (
      message.type === "user" ? "user" : "ai"
    );

    if (message.text) {
      const content = document.createElement("div");
      content.className = "msg-content";

      if (message.type === "ai" &&
          window.marked &&
          window.DOMPurify) {
        try {
          const parsed = marked.parse(message.text);
          content.innerHTML = DOMPurify.sanitize(parsed);

          if (window.hljs) {
            content.querySelectorAll("pre code").forEach(block => {
              hljs.highlightElement(block);
            });
          }

          content.querySelectorAll("a").forEach(link => {
            link.target = "_blank";
            link.rel = "noopener noreferrer";
          });
        } catch (error) {
          console.error("Markdown error:", error);
          content.textContent = message.text;
        }
      } else {
        content.textContent = message.text;
      }

      el.appendChild(content);
    }

    const imageSrc = message.id
      ? temporaryImages.get(message.id)
      : null;

    if (imageSrc) {
      const img = document.createElement("img");
      img.src = imageSrc;
      img.className = "msg-image";
      img.alt = "Gambar pengguna";
      el.appendChild(img);
    }

    chat.appendChild(el);
  });

  chat.scrollTop = chat.scrollHeight;
}

function renderHistory() {
  historyList.innerHTML = "";

  [...conversations]
    .sort((a, b) => (b.updatedAt || 0) - (a.updatedAt || 0))
    .forEach(conversation => {
      const item = document.createElement("div");
      item.className = "history-item";

      const open = document.createElement("button");
      open.type = "button";
      open.className = "history-open";
      open.textContent = conversation.title || "Percakapan";

      open.addEventListener("click", () => {
        activeChatId = conversation.id;
        renderMessages();
        historyPanel.classList.remove("show");
      });

      const remove = document.createElement("button");
      remove.type = "button";
      remove.className = "history-delete";
      remove.textContent = "✕";

      remove.addEventListener("click", () => {
        if (!confirm("Hapus percakapan ini?")) return;

        conversations = conversations.filter(
          item => item.id !== conversation.id
        );

        if (activeChatId === conversation.id) {
          activeChatId = null;
        }

        saveChats();

        if (!activeChatId) {
          createNewChat();
        } else {
          renderMessages();
          renderHistory();
        }
      });

      item.append(open, remove);
      historyList.appendChild(item);
    });
}

// ==================================
// AUTH UI
// ==================================

function updateAuthUI() {
  imageBtn.disabled = !authReady;

  if (currentUser) {
    accountStatus.textContent =
      "Login sebagai: " + (currentUser.email || "Pengguna");

    authForm.style.display = "none";
    logoutBtn.style.display = "inline-block";
    imageBtn.title = "Kirim gambar";
  } else {
    accountStatus.textContent =
      "Mode tamu • Login untuk menggunakan gambar";

    authForm.style.display = "block";
    logoutBtn.style.display = "none";
    imageBtn.title = "Login untuk mengirim gambar";
  }
}

// ==================================
// AUTH INITIALIZATION
// ==================================

async function initializeAuth() {
  if (!window.supabase || !window.supabase.createClient) {
    console.error("Supabase library tidak berhasil dimuat.");
    accountStatus.textContent =
      "Layanan akun tidak tersedia. Mode tamu tetap bisa digunakan.";

    authReady = true;
    updateAuthUI();
    loadChats();
    return;
  }

  try {
    supabaseClient = window.supabase.createClient(
      SUPABASE_URL,
      SUPABASE_KEY
    );

    supabaseClient.auth.onAuthStateChange((event, session) => {
      if (event === "INITIAL_SESSION") return;

      const previousId = currentUser?.id || null;
      const nextId = session?.user?.id || null;

      if (previousId === nextId) return;

      currentUser = session?.user || null;

      selectedImage = null;
      selectedMimeType = null;
      previewImage.src = "";
      previewArea.classList.remove("show");

      updateAuthUI();
      loadChats();
    });

    const { data, error } =
      await supabaseClient.auth.getSession();

    if (error) throw error;

    currentUser = data.session?.user || null;
  } catch (error) {
    console.error("Auth initialization:", error);
    currentUser = null;
    authMessage.textContent =
      "Gagal memeriksa akun: " + error.message;
  }

  authReady = true;
  updateAuthUI();
  loadChats();
}

// ==================================
// REGISTER
// ==================================

async function registerAccount() {
  if (!supabaseClient) {
    authMessage.textContent = "Layanan akun belum tersedia.";
    return;
  }

  const username = $("usernameInput").value.trim();
  const email = $("emailInput").value.trim();
  const password = $("passwordInput").value;

  if (!username || !email || !password) {
    authMessage.textContent =
      "Isi username, email, dan password.";
    return;
  }

  if (password.length < 6) {
    authMessage.textContent =
      "Password minimal 6 karakter.";
    return;
  }

  authMessage.textContent = "Membuat akun...";

  try {
    const { data, error } =
      await supabaseClient.auth.signUp({
        email,
        password,
        options: {
          data: { username }
        }
      });

    if (error) throw error;

    if (data.session) {
      currentUser = data.user;
      updateAuthUI();
      loadChats();
      authMessage.textContent = "Akun berhasil dibuat!";
    } else {
      authMessage.textContent =
        "Pendaftaran berhasil. Periksa email untuk verifikasi.";
    }
  } catch (error) {
    authMessage.textContent = error.message;
  }
}

// ==================================
// LOGIN
// ==================================

async function loginAccount() {
  if (!supabaseClient) {
    authMessage.textContent = "Layanan akun belum tersedia.";
    return;
  }

  const email = $("emailInput").value.trim();
  const password = $("passwordInput").value;

  if (!email || !password) {
    authMessage.textContent =
      "Masukkan email dan password.";
    return;
  }

  authMessage.textContent = "Sedang login...";

  try {
    const { data, error } =
      await supabaseClient.auth.signInWithPassword({
        email,
        password
      });

    if (error) throw error;

    currentUser = data.user;
    updateAuthUI();
    loadChats();
    authMessage.textContent = "Login berhasil!";
  } catch (error) {
    authMessage.textContent = error.message;
  }
}

// ==================================
// LOGOUT
// ==================================

async function logoutAccount() {
  if (!supabaseClient) return;

  try {
    const { error } =
      await supabaseClient.auth.signOut();

    if (error) throw error;

    currentUser = null;
    selectedImage = null;
    selectedMimeType = null;

    previewImage.src = "";
    previewArea.classList.remove("show");

    updateAuthUI();
    loadChats();

    authMessage.textContent = "Berhasil logout.";
  } catch (error) {
    authMessage.textContent = error.message;
  }
}

// ==================================
// IMAGE UPLOAD
// ==================================

function chooseImage() {
  if (!authReady) return;

  if (!currentUser) {
    alert("Login dahulu untuk mengirim gambar.");
    accountPanel.classList.add("show");
    return;
  }

  const choice = confirm("OK = Galeri\nBatal = Kamera");

  if (choice) {
    imageInput.click();
  } else {
    cameraInput.click();
  }
}

function handleImage(file) {
  if (!currentUser) {
    alert("Login dahulu.");
    return;
  }

  if (!file) return;

  const allowed = [
    "image/jpeg",
    "image/png",
    "image/webp"
  ];

  if (!allowed.includes(file.type)) {
    alert("Format harus JPG, PNG, atau WEBP.");
    return;
  }

  if (file.size > 3 * 1024 * 1024) {
    alert("Ukuran gambar maksimal 3 MB.");
    return;
  }

  const reader = new FileReader();

  reader.onload = () => {
    const dataUrl = reader.result;

    selectedImage = dataUrl.split(",")[1];
    selectedMimeType = file.type;

    previewImage.src = dataUrl;
    previewArea
