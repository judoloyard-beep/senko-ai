
<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#0b0b12">
<title>Senko AI</title>

<style>
* {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
}

body {
  background: #0b0b12;
  color: #fff;
  font-family: Arial, sans-serif;
  height: 100dvh;
  overflow: hidden;
}

.app {
  display: flex;
  height: 100dvh;
}

/* SIDEBAR */
.sidebar {
  width: 260px;
  background: #11111b;
  border-right: 1px solid #242435;
  padding: 18px;
  display: flex;
  flex-direction: column;
}

.logo {
  color: #b58aff;
  font-size: 24px;
  font-weight: bold;
  margin-bottom: 25px;
}

.new-chat {
  padding: 13px;
  border: 1px solid #7545b9;
  background: #211633;
  color: white;
  border-radius: 10px;
  cursor: pointer;
  text-align: left;
}

.sidebar-label {
  color: #777;
  font-size: 12px;
  margin: 25px 0 12px;
}

.history {
  color: #aaa;
  font-size: 14px;
}

.profile {
  margin-top: auto;
  padding: 12px;
  background: #191925;
  border-radius: 12px;
  display: flex;
  align-items: center;
  gap: 10px;
}

.avatar {
  width: 38px;
  height: 38px;
  border-radius: 50%;
  background: linear-gradient(135deg, #a855f7, #5526a5);
  display: grid;
  place-items: center;
  font-weight: bold;
}

/* MAIN */
.main {
  flex: 1;
  display: flex;
  flex-direction: column;
  min-width: 0;
}

.header {
  height: 65px;
  border-bottom: 1px solid #242435;
  display: flex;
  align-items: center;
  padding: 0 22px;
  gap: 12px;
}

.header h3 {
  font-size: 17px;
}

.status {
  font-size: 11px;
  color: #a77aff;
  margin-top: 4px;
}

.menu {
  display: none;
  background: none;
  color: white;
  border: none;
  font-size: 22px;
}

.chat-area {
  flex: 1;
  overflow-y: auto;
  padding: 25px 15px;
}

.welcome {
  text-align: center;
  margin: 12vh auto 30px;
}

.welcome h1 {
  font-size: 32px;
  background: linear-gradient(90deg,#fff,#b78aff);
  background-clip: text;
  color: transparent;
}

.welcome p {
  color: #888;
  margin-top: 12px;
}

.messages {
  max-width: 760px;
  margin: auto;
}

.message {
  display: flex;
  margin: 20px 0;
  gap: 12px;
  line-height: 1.6;
  white-space: pre-wrap;
}

.message.user {
  justify-content: flex-end;
}

.message-content {
  max-width: 80%;
  padding: 13px 16px;
  border-radius: 15px;
  font-size: 14px;
}

.ai .message-content {
  background: #191925;
  border: 1px solid #29293c;
}

.user .message-content {
  background: #6336a5;
}

.typing {
  color: #a77aff;
  font-size: 13px;
  margin: 15px 0;
}

/* INPUT */
.input-container {
  padding: 15px;
  width: 100%;
}

.input-box {
  max-width: 760px;
  margin: auto;
  background: #171722;
  border: 1px solid #39304c;
  border-radius: 16px;
  padding: 12px;
}

.input-box textarea {
  width: 100%;
  resize: none;
  background: transparent;
  border: none;
  outline: none;
  color: white;
  font-size: 15px;
  min-height: 45px;
  max-height: 120px;
  padding: 8px;
}

.actions {
  display: flex;
  justify-content: space-between;
  align-items: center;
}

.actions button {
  border: none;
  cursor: pointer;
  color: #ccc;
  background: #292536;
  border-radius: 9px;
  padding: 10px 13px;
}

.actions .send {
  background: #8548d4;
  color: white;
}

.footer {
  text-align: center;
  color: #666;
  font-size: 11px;
  padding: 8px;
}

/* MOBILE */
@media(max-width:700px) {
  .sidebar {
    position: fixed;
    left: -270px;
    top: 0;
    bottom: 0;
    z-index: 10;
    transition: .3s;
  }

  .sidebar.open {
    left: 0;
  }

  .menu {
    display: block;
  }

  .welcome {
    margin-top: 15vh;
  }

  .welcome h1 {
    font-size: 27px;
  }

  .message-content {
    max-width: 90%;
  }
}
</style>
</head>

<body>

<div class="app">

  <aside class="sidebar" id="sidebar">
    <div class="logo">✦ SENKO AI</div>

    <button class="new-chat" onclick="newChat()">
      + Chat Baru
    </button>

    <div class="sidebar-label">RIWAYAT CHAT</div>
    <div class="history" id="history">
      Belum ada percakapan
    </div>

    <div class="profile">
      <div class="avatar">S</div>
      <div>
        <b>Senko AI</b>
        <div style="font-size:11px;color:#888">
          AI Assistant
        </div>
      </div>
    </div>
  </aside>

  <main class="main">

    <header class="header">
      <button class="menu"
        onclick="toggleSidebar()">☰</button>

      <div class="avatar">S</div>

      <div>
        <h3>Senko AI</h3>
        <div class="status">● Online</div>
      </div>
    </header>

    <section class="chat-area" id="chatArea">

      <div class="welcome" id="welcome">
        <h1>Halo, ada yang bisa kubantu?</h1>
        <p>Senko siap menemani ide dan aktivitasmu ✨</p>
      </div>

      <div class="messages" id="messages"></div>

    </section>

    <div class="input-container">
      <div class="input-box">

        <textarea
          id="prompt"
          placeholder="Ketik pesan untuk Senko..."
          rows="1"></textarea>

        <div class="actions">
          <button onclick="document.getElementById('imageInput').click()">
            ＋
          </button>

          <input
            type="file"
            id="imageInput"
            accept="image/png,image/jpeg,image/webp"
            hidden
          >

          <button class="send" onclick="sendMessage()">
            ➤
          </button>
        </div>

      </div>

      <div class="footer">
        Senko AI dapat membuat kesalahan. Periksa informasi penting.
      </div>
    </div>

  </main>
</div>

<script>

const promptInput = document.getElementById("prompt");
const messages = document.getElementById("messages");
const chatArea = document.getElementById("chatArea");

const GUEST_KEY = "senko_guest_id";

function getGuestId() {
  let id = localStorage.getItem(GUEST_KEY);

  if (!id) {
    id = crypto.randomUUID();
    localStorage.setItem(GUEST_KEY, id);
  }

  return id;
}

let conversationHistory = [];

function toggleSidebar() {
  document.getElementById("sidebar")
    .classList.toggle("open");
}

function addMessage(text, type) {
  const div = document.createElement("div");
  div.className = "message " + type;

  const content = document.createElement("div");
  content.className = "message-content";
  content.textContent = text;

  div.appendChild(content);
  messages.appendChild(div);

  chatArea.scrollTop = chatArea.scrollHeight;
}

function newChat() {
  messages.innerHTML = "";
  conversationHistory = [];

  document.getElementById("welcome").style.display = "block";
  document.getElementById("history").textContent =
    "Belum ada percakapan";

  promptInput.value = "";
}

async function sendMessage() {
  const text = promptInput.value.trim();

  if (!text) return;

  document.getElementById("welcome").style.display = "none";

  addMessage(text, "user");
  promptInput.value = "";

  const typing = document.createElement("div");
  typing.className = "typing";
  typing.textContent = "Senko sedang mengetik...";

  messages.appendChild(typing);

  chatArea.scrollTop = chatArea.scrollHeight;

  try {
    const response = await fetch("/api/chat", {
      method: "POST",

      headers: {
        "Content-Type": "application/json"
      },

      body: JSON.stringify({
        message: text,
        userId: getGuestId(),
        isGuest: true,
        history: conversationHistory
      })
    });

    const data = await response.json();

    if (!response.ok) {
      throw new Error(
        data.error || "Server error: " + response.status
      );
    }

    if (!data.reply) {
      throw new Error("Server tidak mengirim jawaban.");
    }

    typing.remove();

    addMessage(data.reply, "ai");

    conversationHistory.push(
      { role: "user", text: text },
      { role: "model", text: data.reply }
    );

    conversationHistory =
      conversationHistory.slice(-12);

    document.getElementById("history").textContent =
      "Percakapan aktif";

  } catch (error) {
    typing.remove();

    addMessage(
      "Gagal: " + error.message,
      "ai"
    );

    console.error("SENKO FRONTEND:", error);
  }
}

promptInput.addEventListener("keydown", function(e) {
  if (e.key === "Enter" && !e.shiftKey) {
    e.preventDefault();
    sendMessage();
  }
});

</script>

</body>
</html>
