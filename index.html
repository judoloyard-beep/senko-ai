
<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Senko AI</title>

<style>
* { box-sizing: border-box; }

body {
  margin: 0;
  background: #0b0d14;
  color: white;
  font-family: Arial, sans-serif;
  height: 100dvh;
  display: flex;
  flex-direction: column;
}

header {
  padding: 15px;
  background: #121522;
  border-bottom: 1px solid #25283a;
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 8px;
}

.logo { font-size: 21px; font-weight: bold; }
.logo span { color: #8b7cff; }

.header-buttons {
  display: flex;
  gap: 7px;
}

button {
  border: 0;
  border-radius: 10px;
  padding: 11px 13px;
  background: #7868ff;
  color: white;
  font-weight: bold;
  cursor: pointer;
}

button:disabled {
  opacity: .5;
  cursor: not-allowed;
}

#accountPanel {
  display: none;
  padding: 15px;
  background: #121522;
  border-bottom: 1px solid #25283a;
}

#accountPanel.show { display: block; }

#accountPanel input {
  width: 100%;
  margin: 5px 0;
  padding: 12px;
  border-radius: 9px;
  border: 1px solid #34384c;
  background: #1c2030;
  color: white;
}

#authMessage {
  color: #c2baff;
  font-size: 13px;
  margin-top: 8px;
}

#historyPanel {
  display: none;
  background: #121522;
  border-bottom: 1px solid #25283a;
  padding: 12px;
  max-height: 230px;
  overflow-y: auto;
}

#historyPanel.show { display: block; }

.history-title {
  font-size: 13px;
  color: #aaa;
  margin-bottom: 10px;
}

.history-item {
  display: flex;
  gap: 8px;
  margin-bottom: 7px;
}

.history-open {
  flex: 1;
  min-width: 0;
  text-align: left;
  background: #202438;
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
}

.history-delete { background: #a33c50; }

#chat {
  flex: 1;
  overflow-y: auto;
  padding: 20px;
  display: flex;
  flex-direction: column;
  gap: 15px;
}

.msg {
  padding: 13px 16px;
  border-radius: 15px;
  max-width: 85%;
  line-height: 1.5;
  white-space: pre-wrap;
  overflow-wrap: anywhere;
}

.user {
  background: #6254dc;
  align-self: flex-end;
}

.ai {
  background: #191d2b;
  align-self: flex-start;
}

.msg-image {
  display: block;
  max-width: 210px;
  max-height: 210px;
  width: auto;
  height: auto;
  object-fit: contain;
  border-radius: 10px;
  margin-top: 8px;
}

footer {
  padding: 12px;
  display: flex;
  gap: 8px;
  align-items: center;
  background: #121522;
}

#input {
  flex: 1;
  min-width: 0;
  padding: 14px;
  border-radius: 12px;
  border: 1px solid #34384c;
  background: #1c2030;
  color: white;
  font-size: 15px;
}

#imageBtn {
  background: #292d43;
  font-size: 18px;
  padding: 12px;
}

#previewArea {
  display: none;
  padding: 10px 15px;
  background: #121522;
  border-top: 1px solid #25283a;
}

#previewArea.show { display: flex; }

#previewImage {
  width: 75px;
  height: 75px;
  object-fit: cover;
  border-radius: 10px;
}

#removeImage {
  background: #a33c50;
  margin-left: 10px;
}
</style>
</head>

<body>

<header>
  <div class="logo">✦ <span>SENKO</span>POKE</div>

  <div class="header-buttons">
    <button id="accountBtn">Akun</button>
    <button id="historyBtn">☰</button>
    <button id="newChatBtn">＋ Chat</button>
  </div>
</header>

<section id="accountPanel">
  <div id="accountStatus">Belum login</div>

  <div id="authForm">
    <input id="usernameInput"
      placeholder="Username (untuk daftar)">

    <input id="emailInput"
      type="email"
      placeholder="Email">

    <input id="passwordInput"
      type="password"
      placeholder="Password minimal 6 karakter">

    <div class="header-buttons">
      <button id="registerBtn">Daftar</button>
      <button id="loginBtn">Login</button>
    </div>
  </div>

  <button id="logoutBtn" style="display:none;background:#a33c50">
    Logout
  </button>

  <div id="authMessage"></div>
</section>

<section id="historyPanel">
  <div class="history-title">RIWAYAT YAPPINGANMU</div>
  <div id="historyList"></div>
</section>

<main id="chat"></main>

<div id="previewArea">
  <img id="previewImage" alt="Preview gambar">
  <button id="removeImage">✕</button>
</div>

<footer>
  <button id="imageBtn" type="button" disabled>📎</button>

  <input id="imageInput" type="file"
    accept="image/jpeg,image/png,image/webp" hidden>

  <input id="cameraInput" type="file"
    accept="image/jpeg,image/png,image/webp"
    capture="environment" hidden>

  <input id="input"
    placeholder="Ketik sini lawak"
    autocomplete="off">

  <button id="send">Kirim rek</button>
</footer>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script>
const SUPABASE_URL =
  'https://mtgfciwnuxaxbjoencvg.supabase.co';

const SUPABASE_KEY =
  'sb_publishable_DLnbdI8iZt9uqGcUwViHMw_o-8XSjPi';

const supabaseClient = window.supabase.createClient(
  SUPABASE_URL,
  SUPABASE_KEY
);

// ELEMENT
const chat = document.getElementById('chat');
const input = document.getElementById('input');
const send = document.getElementById('send');

const imageBtn = document.getElementById('imageBtn');
const imageInput = document.getElementById('imageInput');
const cameraInput = document.getElementById('cameraInput');

const previewArea = document.getElementById('previewArea');
const previewImage = document.getElementById('previewImage');
const removeImage = document.getElementById('removeImage');

const historyPanel = document.getElementById('historyPanel');
const historyList = document.getElementById('historyList');

const accountPanel = document.getElementById('accountPanel');
const accountStatus = document.getElementById('accountStatus');
const authMessage = document.getElementById('authMessage');

const usernameInput = document.getElementById('usernameInput');
const emailInput = document.getElementById('emailInput');
const passwordInput = document.getElementById('passwordInput');

const authForm = document.getElementById('authForm');
const logoutBtn = document.getElementById('logoutBtn');

let currentUser = null;
let authReady = false;

let selectedImage = null;
let selectedMimeType = null;

let conversations = [];
let activeChatId = null;
let activeStorageKey = null;

// RIWAYAT TERPISAH UNTUK TAMU DAN SETIAP AKUN
function loadChats() {
  activeStorageKey = currentUser
    ? 'senko_chats_user_' + currentUser.id
    : 'senko_chats_guest';

  try {
    conversations = JSON.parse(
      localStorage.getItem(activeStorageKey) || '[]'
    );

    if (!Array.isArray(conversations)) {
      conversations = [];
    }
  } catch {
    conversations = [];
  }

  activeChatId = null;

  if (conversations.length) {
    conversations.sort((a, b) => b.updatedAt - a.updatedAt);
    activeChatId = conversations[0].id;
    renderMessages();
    renderHistory();
  } else {
    newChat();
  }
}

function saveChats() {
  if (!activeStorageKey) return;

  try {
    localStorage.setItem(
      activeStorageKey,
      JSON.stringify(conversations)
    );
  } catch {
    alert('Penyimpanan penuh atau tidak tersedia.');
  }
}

function getActiveChat() {
  return conversations.find(c => c.id === activeChatId);
}

// STATUS LOGIN
function updateAuthUI() {
  imageBtn.disabled = !currentUser;

  if (currentUser) {
    accountStatus.textContent =
      'Login sebagai: ' + currentUser.email;

    authForm.style.display = 'none';
    logoutBtn.style.display = 'inline-block';
  } else {
    accountStatus.textContent = 'Kamu sedang menggunakan mode tamu';

    authForm.style.display = 'block';
    logoutBtn.style.display = 'none';
  }
}

async function checkLogin() {
  const { data, error } =
    await supabaseClient.auth.getSession();

  if (error) {
    authMessage.textContent = error.message;
  }

  currentUser = data?.session?.user || null;
  authReady = true;

  updateAuthUI();
  loadChats();
}

// DAFTAR AKUN
async function registerAccount() {
  const username = usernameInput.value.trim();
  const email = emailInput.value.trim();
  const password = passwordInput.value;

  if (!username || !email || !password) {
    authMessage.textContent =
      'Isi username, email, dan password dahulu.';
    return;
  }

  if (password.length < 6) {
    authMessage.textContent =
      'Password minimal 6 karakter.';
    return;
  }

  authMessage.textContent = 'Sedang membuat akun...';

  const { data, error } =
    await supabaseClient.auth.signUp({
      email,
      password,
      options: {
        data: { username }
      }
    });

  if (error) {
    authMessage.textContent = error.message;
    return;
  }

  if (data.session) {
    currentUser = data.session.user;
    updateAuthUI();
    loadChats();

    authMessage.textContent = 'Akun berhasil dibuat!';
  } else {
    authMessage.textContent =
      'Pendaftaran berhasil. Periksa email untuk verifikasi sebelum login.';
  }
}

// LOGIN
async function loginAccount() {
  const email = emailInput.value.trim();
  const password = passwordInput.value;

  if (!email || !password) {
    authMessage.textContent =
      'Masukkan email dan password.';
    return;
  }

  authMessage.textContent = 'Sedang login...';

  const { data, error } =
    await supabaseClient.auth.signInWithPassword({
      email,
      password
    });

  if (error) {
    authMessage.textContent = error.message;
    return;
  }

  currentUser = data.user;
  updateAuthUI();
  loadChats();

  authMessage.textContent = 'Login berhasil!';
}

// LOGOUT
async function logoutAccount() {
  const { error } = await supabaseClient.auth.signOut();

  if (error) {
    authMessage.textContent = error.message;
    return;
  }

  currentUser = null;
  selectedImage = null;
  selectedMimeType = null;

  previewImage.src = '';
  previewArea.classList.remove('show');

  updateAuthUI();
  loadChats();

  authMessage.textContent = 'Kamu sudah logout.';
}

// PERUBAHAN STATUS AUTENTIKASI
supabaseClient.auth.onAuthStateChange(
  (event, session) => {
    if (event === 'INITIAL_SESSION') return;

    currentUser = session?.user || null;

    updateAuthUI();
    loadChats();
  }
);

// CHAT
function newChat() {
  const conversation = {
    id: crypto.randomUUID(),
    title: 'Percakapan baru',
    updatedAt: Date.now(),
    messages: []
  };

  conversations.unshift(conversation);
  activeChatId = conversation.id;

  saveChats();
  renderMessages();
  renderHistory();

  historyPanel.classList.remove('show');
}

function renderMessages() {
  chat.innerHTML = '';

  const conversation = getActiveChat();
  if (!conversation) return;

  conversation.messages.forEach(message => {
    const el = document.createElement('div');
    el.className = 'msg ' + message.type;

    if (message.text) {
      const text = document.createElement('div');
      text.textContent = message.text;
      el.appendChild(text);
    }

    if (message.image) {
      const img = document.createElement('img');
      img.src = message.image;
      img.className = 'msg-image';
      img.alt = 'Gambar yang dikirim';
      el.appendChild(img);
    }

    chat.appendChild(el);
  });

  chat.scrollTop = chat.scrollHeight;
}

function renderHistory() {
  historyList.innerHTML = '';

  [...conversations]
    .sort((a, b) => b.updatedAt - a.updatedAt)
    .forEach(conversation => {
      const item = document.createElement('div');
      item.className = 'history-item';

      const open = document.createElement('button');
      open.className = 'history-open';
      open.textContent = conversation.title;

      open.onclick = () => {
        activeChatId = conversation.id;
        renderMessages();
        historyPanel.classList.remove('show');
      };

      const remove = document.createElement('button');
      remove.className = 'history-delete';
      remove.textContent = '✕';

      remove.onclick = () => {
        if (!confirm('Hapus percakapan ini?')) return;

        conversations = conversations.filter(
          c => c.id !== conversation.id
        );

        if (activeChatId === conversation.id) {
          activeChatId = conversations[0]?.id || null;
        }

        saveChats();

        if (!activeChatId) {
          newChat();
        } else {
          renderMessages();
          renderHistory();
        }
      };

      item.appendChild(open);
      item.appendChild(remove);
      historyList.appendChild(item);
    });
}

// GAMBAR
imageBtn.addEventListener('click', () => {
  if (!currentUser) {
    alert('Login dahulu untuk menggunakan fitur gambar.');
    return;
  }

  const choice = confirm(
    'OK untuk membuka galeri. Batal untuk membuka kamera.'
  );

  if (choice) {
    imageInput.click();
  } else {
    cameraInput.click();
  }
});

function handleImage(file) {
  if (!currentUser) {
    alert('Login dahulu untuk mengirim gambar.');
    return;
  }

  if (!file) return;

  const allowedTypes = [
    'image/jpeg',
    'image/png',
    'image/webp'
  ];

  if (!allowedTypes.includes(file.type)) {
    alert('Format gambar harus JPG, PNG, atau WEBP.');
    return;
  }

  if (file.size > 20 * 1024 * 1024) {
    alert('Ukuran gambar maksimal 20 MB.');
    return;
  }

  const reader = new FileReader();

  reader.onload = () => {
    const dataUrl = reader.result;

    selectedImage = dataUrl.split(',')[1];
    selectedMimeType = file.type;

    previewImage.src = dataUrl;
    previewArea.classList.add('show');
  };

  reader.readAsDataURL(file);
}

imageInput.addEventListener('change', e => {
  handleImage(e.target.files[0]);
  e.target.value = '';
});

cameraInput.addEventListener('change', e => {
  handleImage(e.target.files[0]);
  e.target.value = '';
});

removeImage.addEventListener('click', () => {
  selectedImage = null;
  selectedMimeType = null;
  previewImage.src = '';
  previewArea.classList.remove('show');
});

// KIRIM PESAN
async function ask() {
  if (!authReady || send.disabled) return;

  const message = input.value.trim();

  if ((!message && !selectedImage)) return;

  if (selectedImage && !currentUser) {
    alert('Login dahulu untuk mengirim gambar.');
    return;
  }

  let conversation = getActiveChat();

  if (!conversation) {
    newChat();
    conversation = getActiveChat();
  }

  const currentId = conversation.id;
  const imageToSend = selectedImage;
  const mimeToSend = selectedMimeType;

  const imagePreview = imageToSend
    ? `data:${mimeToSend};base64,${imageToSend}`
    : null;

  input.value = '';
  selectedImage = null;
  selectedMimeType = null;

  previewImage.src = '';
  previewArea.classList.remove('show');

  conversation.messages.push({
    text: message,
    image: imagePreview,
    type: 'user'
  });

  if (conversation.title === 'Percakapan baru') {
    conversation.title =
      (message || 'Gambar').slice(0, 35);
  }

  conversation.updatedAt = Date.now();

  saveChats();
  renderMessages();
  renderHistory();

  send.disabled = true;

  const loading = document.createElement('div');
  loading.className = 'msg ai';
  loading.textContent = 'mengetik...';

  if (activeChatId === currentId) {
    chat.appendChild(loading);
  }

  try {
    const headers = {
      'Content-Type': 'application/json'
    };

    // Token akun dikirim untuk pemeriksaan backend.
    if (currentUser) {
      const { data } =
        await supabaseClient.auth.getSession();

      const token = data.session?.access_token;

      if (token) {
        headers.Authorization = 'Bearer ' + token;
      }
    }

    const res = await fetch('/api/chat', {
      method: 'POST',
      headers,
      body: JSON.stringify({
        message,
        userId: currentUser?.id || 'guest',
        image: imageToSend
          ? {
              mimeType: mimeToSend,
              data: imageToSend
            }
          : null
      })
    });

    const data = await res.json();

    if (!res.ok) {
      throw new Error(data.error || 'Terjadi kesalahan');
    }

    conversation.messages.push({
      text: data.reply,
      type: 'ai'
    });

  } catch (error) {
    conversation.messages.push({
      text: 'Gagal: ' + error.message,
      type: 'ai'
    });
  } finally {
    conversation.updatedAt = Date.now();

    saveChats();
    renderHistory();

    if (activeChatId === currentId) {
      renderMessages();
    }

    send.disabled = false;
    input.focus();
  }
}

// TOMBOL
document.getElementById('accountBtn')
  .addEventListener('click', () => {
    accountPanel.classList.toggle('show');
  });

document.getElementById('registerBtn')
  .addEventListener('click', registerAccount);

document.getElementById('loginBtn')
  .addEventListener('click', loginAccount);

logoutBtn.addEventListener('click', logoutAccount);

document.getElementById('newChatBtn')
  .addEventListener('click', newChat);

document.getElementById('historyBtn')
  .addEventListener('click', () => {
    historyPanel.classList.toggle('show');
  });

send.addEventListener('click', ask);

input.addEventListener('keydown', e => {
  if (e.key === 'Enter') ask();
});

// MULAI APLIKASI
checkLogin();
</script>

</body>
</html>
