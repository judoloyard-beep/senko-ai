
<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Senko Ai</title>

<style>
* { box-sizing: border-box; }

body {
  margin: 0;
  background: #0b0d14;
  color: white;
  font-family: Arial, sans-serif;
  height: 100dvh;
  display: flex;
  flex-direction: column;
}

header {
  padding: 15px;
  background: #121522;
  border-bottom: 1px solid #25283a;
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 8px;
}

.logo {
  font-size: 21px;
  font-weight: bold;
}

.logo span { color: #8b7cff; }

.header-buttons {
  display: flex;
  gap: 7px;
}

button {
  border: 0;
  border-radius: 10px;
  padding: 11px 13px;
  background: #7868ff;
  color: white;
  font-weight: bold;
  cursor: pointer;
}

#historyPanel {
  display: none;
  background: #121522;
  border-bottom: 1px solid #25283a;
  padding: 12px;
  max-height: 230px;
  overflow-y: auto;
}

#historyPanel.show { display: block; }

.history-title {
  font-size: 13px;
  color: #aaa;
  margin-bottom: 10px;
}

.history-item {
  display: flex;
  gap: 8px;
  margin-bottom: 7px;
}

.history-open {
  flex: 1;
  min-width: 0;
  text-align: left;
  background: #202438;
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
}

.history-delete { background: #a33c50; }

#chat {
  flex: 1;
  overflow-y: auto;
  padding: 20px;
  display: flex;
  flex-direction: column;
  gap: 15px;
}

.msg {
  padding: 13px 16px;
  border-radius: 15px;
  max-width: 85%;
  line-height: 1.5;
  white-space: pre-wrap;
  overflow-wrap: anywhere;
}

.user {
  background: #6254dc;
  align-self: flex-end;
}

.ai {
  background: #191d2b;
  align-self: flex-start;
}

.msg-image {
  display: block;
  max-width: 210px;
  max-height: 210px;
  width: auto;
  height: auto;
  object-fit: contain;
  border-radius: 10px;
  margin-top: 8px;
}

footer {
  padding: 12px;
  display: flex;
  gap: 8px;
  align-items: center;
  background: #121522;
}

#input {
  flex: 1;
  min-width: 0;
  padding: 14px;
  border-radius: 12px;
  border: 1px solid #34384c;
  background: #1c2030;
  color: white;
  font-size: 15px;
}

#imageBtn {
  background: #292d43;
  font-size: 18px;
  padding: 12px;
}

#previewArea {
  display: none;
  padding: 10px 15px;
  background: #121522;
  border-top: 1px solid #25283a;
}

#previewArea.show { display: flex; }

#previewImage {
  width: 75px;
  height: 75px;
  object-fit: cover;
  border-radius: 10px;
}

#removeImage {
  background: #a33c50;
  margin-left: 10px;
}

button:disabled {
  opacity: 0.5;
}
</style>
</head>

<body>

<header>
  <div class="logo">✦ <span>SENKO</span>POKE</div>

  <div class="header-buttons">
    <button id="historyBtn">☰</button>
    <button id="newChatBtn">＋ Chat</button>
  </div>
</header>

<section id="historyPanel">
  <div class="history-title">RIWAYAT YAPPINGANMU</div>
  <div id="historyList"></div>
</section>

<main id="chat"></main>

<div id="previewArea">
  <img id="previewImage" alt="Preview gambar">
  <button id="removeImage">✕</button>
</div>

<footer>
  <button id="imageBtn" type="button">📎</button>

  <input id="imageInput" type="file"
    accept="image/jpeg,image/png,image/webp"
    hidden>

  <input id="cameraInput" type="file"
    accept="image/jpeg,image/png,image/webp"
    capture="environment"
    hidden>

  <input id="input"
    placeholder="Ketik sini lawak"
    autocomplete="off">

  <button id="send">Kirim rek</button>
</footer>

<script>
const chat = document.getElementById('chat');
const input = document.getElementById('input');
const send = document.getElementById('send');
const historyPanel = document.getElementById('historyPanel');
const historyList = document.getElementById('historyList');

const imageBtn = document.getElementById('imageBtn');
const imageInput = document.getElementById('imageInput');
const cameraInput = document.getElementById('cameraInput');
const previewArea = document.getElementById('previewArea');
const previewImage = document.getElementById('previewImage');
const removeImage = document.getElementById('removeImage');

const CHAT_KEY = 'senko_chats_v1';

let selectedImage = null;
let selectedMimeType = null;

let userId = localStorage.getItem('senko_user_id');

if (!userId) {
  userId = crypto.randomUUID();
  localStorage.setItem('senko_user_id', userId);
}

let conversations = [];

try {
  conversations = JSON.parse(
    localStorage.getItem(CHAT_KEY) || '[]'
  );

  if (!Array.isArray(conversations)) {
    conversations = [];
  }
} catch {
  conversations = [];
}

let activeChatId = null;

function saveChats() {
  try {
    localStorage.setItem(
      CHAT_KEY,
      JSON.stringify(conversations)
    );
    return true;
  } catch {
    alert('Penyimpanan penuh atau tidak tersedia.');
    return false;
  }
}

function getActiveChat() {
  return conversations.find(c => c.id === activeChatId);
}

function newChat() {
  const conversation = {
    id: crypto.randomUUID(),
    title: 'Percakapan baru',
    updatedAt: Date.now(),
    messages: []
  };

  conversations.unshift(conversation);
  activeChatId = conversation.id;

  saveChats();
  renderMessages();
  renderHistory();

  historyPanel.classList.remove('show');
}

function renderMessages() {
  chat.innerHTML = '';

  const conversation = getActiveChat();
  if (!conversation) return;

  conversation.messages.forEach(message => {
    const el = document.createElement('div');
    el.className = 'msg ' + message.type;

    if (message.text) {
      const text = document.createElement('div');
      text.textContent = message.text;
      el.appendChild(text);
    }

    if (message.image) {
      const img = document.createElement('img');
      img.src = message.image;
      img.className = 'msg-image';
      img.alt = 'Gambar yang dikirim';
      el.appendChild(img);
    }

    chat.appendChild(el);
  });

  chat.scrollTop = chat.scrollHeight;
}

function renderHistory() {
  historyList.innerHTML = '';

  const sorted = [...conversations].sort(
    (a, b) => b.updatedAt - a.updatedAt
  );

  sorted.forEach(conversation => {
    const item = document.createElement('div');
    item.className = 'history-item';

    const open = document.createElement('button');
    open.className = 'history-open';
    open.textContent = conversation.title;

    open.onclick = () => {
      activeChatId = conversation.id;
      renderMessages();
      historyPanel.classList.remove('show');
    };

    const remove = document.createElement('button');
    remove.className = 'history-delete';
    remove.textContent = '✕';

    remove.onclick = () => {
      if (!confirm('Hapus percakapan ini?')) return;

      conversations = conversations.filter(
        c => c.id !== conversation.id
      );

      saveChats();

      if (activeChatId === conversation.id) {
        activeChatId = null;

        if (conversations.length) {
          activeChatId = conversations[0].id;
        } else {
          newChat();
        }
      }

      renderMessages();
      renderHistory();
    };

    item.appendChild(open);
    item.appendChild(remove);
    historyList.appendChild(item);
  });
}

// Pilihan galeri atau kamera
imageBtn.addEventListener('click', () => {
  const choice = confirm(
    'pilih OK ya buat buka galeri lu. pilih Batal buat lu ngaca.'
  );

  if (choice) {
    imageInput.click();
  } else {
    cameraInput.click();
  }
});

// Memproses gambar
function handleImage(file) {
  if (!file) return;

  const allowedTypes = [
    'image/jpeg',
    'image/png',
    'image/webp'
  ];

  if (!allowedTypes.includes(file.type)) {
    alert('Format gambar harus JPG, PNG, atau WEBP.');
    return;
  }

  if (file.size > 2.5 * 1024 * 1024) {
    alert('Ukuran gambar maksimal 5 MB.');
    return;
  }

  const reader = new FileReader();

  reader.onload = () => {
    const dataUrl = reader.result;

    selectedImage = dataUrl.split(',')[1];
    selectedMimeType = file.type;

    previewImage.src = dataUrl;
    previewArea.classList.add('show');
  };

  reader.readAsDataURL(file);
}

imageInput.addEventListener('change', e => {
  handleImage(e.target.files[0]);
  e.target.value = '';
});

cameraInput.addEventListener('change', e => {
  handleImage(e.target.files[0]);
  e.target.value = '';
});

removeImage.addEventListener('click', () => {
  selectedImage = null;
  selectedMimeType = null;
  previewImage.src = '';
  previewArea.classList.remove('show');
});

// Mengirim pesan dan gambar ke AI
async function ask() {
  const message = input.value.trim();

  if ((!message && !selectedImage) || send.disabled) return;

  let conversation = getActiveChat();

  if (!conversation) {
    newChat();
    conversation = getActiveChat();
  }

  const currentId = conversation.id;
  const imageToSend = selectedImage;
  const mimeToSend = selectedMimeType;
  const imagePreview = imageToSend
    ? `data:${mimeToSend};base64,${imageToSend}`
    : null;

  input.value = '';
  selectedImage = null;
  selectedMimeType = null;
  previewImage.src = '';
  previewArea.classList.remove('show');

  conversation.messages.push({
    text: message,
    image: imagePreview,
    type: 'user'
  });

  if (conversation.title === 'Percakapan baru') {
    conversation.title = (message || 'Gambar').slice(0, 35);
  }

  conversation.updatedAt = Date.now();

  saveChats();
  renderMessages();
  renderHistory();

  const loading = document.createElement('div');
  loading.className = 'msg ai';
  loading.textContent = 'Senko sedang berpikir...';

  if (activeChatId === currentId) {
    chat.appendChild(loading);
  }

  send.disabled = true;

  try {
    const res = await fetch('/api/chat', {
      method: 'POST',
      headers: {
        'Content-Type': 'application/json'
      },
      body: JSON.stringify({
        message: message,
        userId: userId,
        image: imageToSend
          ? {
              mimeType: mimeToSend,
              data: imageToSend
            }
          : null
      })
    });

    const data = await res.json();

    if (!res.ok) {
      throw new Error(data.error || 'Terjadi kesalahan');
    }

    conversation.messages.push({
      text: data.reply,
      type: 'ai'
    });

  } catch (error) {
    conversation.messages.push({
      text: 'Gagal: ' + error.message,
      type: 'ai'
    });
  } finally {
    conversation.updatedAt = Date.now();

    saveChats();
    renderHistory();

    if (activeChatId === currentId) {
      renderMessages();
    }

    send.disabled = false;
    input.focus();
  }
}

document.getElementById('newChatBtn')
  .addEventListener('click', newChat);

document.getElementById('historyBtn')
  .addEventListener('click', () => {
    historyPanel.classList.toggle('show');
  });

send.addEventListener('click', ask);

input.addEventListener('keydown', e => {
  if (e.key === 'Enter') ask();
});

if (conversations.length) {
  activeChatId = [...conversations].sort(
    (a, b) => b.updatedAt - a.updatedAt
  )[0].id;

  renderMessages();
  renderHistory();
} else {
  newChat();
}
</script>

</body>
</html>
