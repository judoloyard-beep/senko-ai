<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#0b0d14">
<title>Senko AI</title>

<link rel="stylesheet"
href="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.11.1/styles/github-dark.min.css">

<script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.11.1/highlight.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/dompurify@3.2.6/dist/purify.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
* {
  box-sizing: border-box;
}

body {
  margin: 0;
  background: #0b0d14;
  color: #fff;
  font-family: Arial, sans-serif;
  height: 100dvh;
  display: flex;
  flex-direction: column;
}

button {
  border: 0;
  border-radius: 10px;
  padding: 11px 13px;
  background: #7868ff;
  color: white;
  font-weight: bold;
  cursor: pointer;
}

button:disabled {
  opacity: .5;
  cursor: not-allowed;
}

header {
  padding: 13px;
  background: #121522;
  border-bottom: 1px solid #25283a;
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 8px;
}

.logo {
  font-size: 20px;
  font-weight: bold;
  white-space: nowrap;
}

.logo span {
  color: #9889ff;
}

.header-buttons {
  display: flex;
  gap: 6px;
}

.header-buttons button {
  padding: 10px;
  font-size: 12px;
}

#accountPanel,
#historyPanel {
  display: none;
  padding: 14px;
  background: #121522;
  border-bottom: 1px solid #25283a;
}

#accountPanel.show,
#historyPanel.show {
  display: block;
}

#accountPanel input {
  width: 100%;
  padding: 12px;
  margin: 5px 0;
  background: #1c2030;
  border: 1px solid #34384c;
  border-radius: 9px;
  color: white;
}

#accountStatus {
  margin-bottom: 10px;
  color: #c2baff;
  font-size: 13px;
}

#authMessage {
  color: #c2baff;
  font-size: 13px;
  margin-top: 9px;
}

#historyPanel {
  max-height: 230px;
  overflow-y: auto;
}

.history-title {
  color: #aaa;
  font-size: 12px;
  margin-bottom: 10px;
}

.history-item {
  display: flex;
  gap: 7px;
  margin-bottom: 7px;
}

.history-open {
  flex: 1;
  text-align: left;
  background: #202438;
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
}

.history-delete {
  background: #a33c50;
}

#chat {
  flex: 1;
  overflow-y: auto;
  padding: 16px;
  display: flex;
  flex-direction: column;
  gap: 14px;
  scroll-behavior: smooth;
}

.welcome {
  margin: auto;
  text-align: center;
  color: #aaa;
  max-width: 290px;
}

.welcome h2 {
  color: white;
}

.welcome span {
  color: #9585ff;
}

.msg {
  padding: 13px 15px;
  border-radius: 15px;
  max-width: 92%;
  line-height: 1.6;
  overflow-wrap: anywhere;
}

.user {
  background: #6254dc;
  align-self: flex-end;
}

.ai {
  background: #191d2b;
  align-self: flex-start;
}

.msg-content p {
  margin: 4px 0 12px;
}

.msg-content ul,
.msg-content ol {
  padding-left: 22px;
}

.msg-content pre {
  background: #080a10;
  padding: 12px;
  border-radius: 10px;
  overflow-x: auto;
  max-width: 100%;
}

.msg-content pre code {
  font-size: 13px;
  white-space: pre;
}

.msg-content :not(pre) > code {
  background: #292d43;
  padding: 3px 6px;
  border-radius: 5px;
}

.msg-image {
  display: block;
  max-width: 230px;
  max-height: 230px;
  object-fit: contain;
  border-radius: 10px;
  margin-top: 8px;
}

.typing {
  color: #aaa;
  font-size: 13px;
  animation: pulse 1s infinite alternate;
}

@keyframes pulse {
  to { opacity: .4; }
}

#previewArea {
  display: none;
  padding: 10px;
  background: #121522;
  align-items: center;
  gap: 10px;
}

#previewArea.show {
  display: flex;
}

#previewImage {
  width: 65px;
  height: 65px;
  object-fit: cover;
  border-radius: 9px;
}

#removeImage {
  background: #a33c50;
}

footer {
  padding: 10px;
  display: flex;
  gap: 7px;
  align-items: center;
  background: #121522;
  border-top: 1px solid #25283a;
}

#input {
  flex: 1;
  min-width: 0;
  padding: 13px;
  border-radius: 11px;
  border: 1px solid #34384c;
  background: #1c2030;
  color: white;
  font-size: 15px;
  outline: none;
}

#input:focus {
  border-color: #7868ff;
}

#imageBtn {
  background: #292d43;
  font-size: 18px;
  padding: 11px;
}

#send {
  padding: 12px;
}

#logoutBtn {
  background: #a33c50;
}

.small-note {
  color: #888;
  font-size: 11px;
  text-align: center;
  padding: 5px;
}

@media (max-width: 380px) {
  .logo { font-size: 16px; }
  .header-buttons button { padding: 9px 7px; }
  #chat { padding: 10px; }
}
</style>
</head>

<body>

<header>
  <div class="logo">✦ <span>SENKO</span>AI</div>

  <div class="header-buttons">
    <button id="accountBtn">Akun</button>
    <button id="historyBtn">☰</button>
    <button id="newChatBtn">＋ Chat</button>
  </div>
</header>

<section id="accountPanel">
  <div id="accountStatus">Memeriksa akun...</div>

  <div id="authForm">
    <input id="usernameInput"
      placeholder="Username"
      autocomplete="username">

    <input id="emailInput"
      type="email"
      placeholder="Email"
      autocomplete="email">

    <input id="passwordInput"
      type="password"
      placeholder="Password minimal 6 karakter"
      autocomplete="current-password">

    <div class="header-buttons">
      <button id="registerBtn">Daftar</button>
      <button id="loginBtn">Login</button>
    </div>
  </div>

  <button id="logoutBtn" style="display:none">
    Logout
  </button>

  <div id="authMessage"></div>
</section>

<section id="historyPanel">
  <div class="history-title">RIWAYAT PERCAKAPAN</div>
  <div id="historyList"></div>
</section>

<main id="chat">
  <div class="welcome">
    <h2>✦ SENKO <span>AI</span></h2>
    <p>halo kaka! ada yang bisa senko bantu?</p>
  </div>
</main>

<div id="previewArea">
  <img id="previewImage" alt="Preview gambar">
  <button id="removeImage">✕</button>
</div>

<footer>
  <button id="imageBtn" disabled>📎</button>

  <input id="imageInput"
    type="file"
    accept="image/jpeg,image/png,image/webp"
    hidden>

  <input id="cameraInput"
    type="file"
    accept="image/jpeg,image/png,image/webp"
    capture="environment"
    hidden>

  <input id="input"
    placeholder="Ketik pesan..."
    autocomplete="off">

  <button id="send">Kirim</button>
</footer>

<div class="small-note">
  Senko AI • Your personal AI assistant
</div>

<script>
const SUPABASE_URL =
  "https://mtgfciwnuxaxbjoencvg.supabase.co";

const SUPABASE_KEY =
  "sb_publishable_DLnbdI8iZt9uqGcUwViHMw_o-8XSjPi";

const supabaseClient = window.supabase.createClient(
  SUPABASE_URL,
  SUPABASE_KEY
);

// ==================================
// ELEMENTS
// ==================================

const $ = id => document.getElementById(id);

const chat = $("chat");
const input = $("input");
const send = $("send");

const accountPanel = $("accountPanel");
const historyPanel = $("historyPanel");

const accountStatus = $("accountStatus");
const authMessage = $("authMessage");
const authForm = $("authForm");
const logoutBtn = $("logoutBtn");

const imageBtn = $("imageBtn");
const imageInput = $("imageInput");
const cameraInput = $("cameraInput");

const previewArea = $("previewArea");
const previewImage = $("previewImage");

const historyList = $("historyList");

// ==================================
// STATE
// ==================================

let currentUser = null;
let authReady = false;

let selectedImage = null;
let selectedMimeType = null;

let conversations = [];
let activeChatId = null;
let activeStorageKey = null;

let sending = false;

const temporaryImages = new Map();

let guestId = localStorage.getItem("senko_user_id");

if (!guestId ||
    !/^[0-9a-f-]{36}$/i.test(guestId)) {
  guestId = crypto.randomUUID();
  localStorage.setItem("senko_user_id", guestId);
}

// ==================================
// STORAGE
// ==================================

function getActiveChat() {
  return conversations.find(
    item => item.id === activeChatId
  );
}

function saveChats() {
  if (!activeStorageKey) return;

  try {
    const lightweight = conversations.map(c => ({
      ...c,
      messages: c.messages.map(m => ({
        id: m.id,
        type: m.type,
        text: m.text || ""
      }))
    }));

    localStorage.setItem(
      activeStorageKey,
      JSON.stringify(lightweight)
    );

  } catch (error) {
    console.error("Storage:", error);
    authMessage.textContent =
      "Penyimpanan riwayat gagal.";
  }
}

function loadChats() {
  activeStorageKey = currentUser
    ? "senko_chats_user_" + currentUser.id
    : "senko_chats_guest";

  try {
    const stored = JSON.parse(
      localStorage.getItem(activeStorageKey) || "[]"
    );

    conversations = Array.isArray(stored)
      ? stored
      : [];

  } catch {
    conversations = [];
  }

  conversations.sort(
    (a, b) => b.updatedAt - a.updatedAt
  );

  activeChatId = conversations[0]?.id || null;

  if (!activeChatId) {
    createNewChat();
  } else {
    renderMessages();
    renderHistory();
  }
}

// ==================================
// CHAT MANAGEMENT
// ==================================

function createNewChat() {
  const conversation = {
    id: crypto.randomUUID(),
    title: "Percakapan baru",
    updatedAt: Date.now(),
    messages: []
  };

  conversations.unshift(conversation);
  activeChatId = conversation.id;

  saveChats();
  renderMessages();
  renderHistory();

  historyPanel.classList.remove("show");
}

function renderMessages() {
  chat.innerHTML = "";

  const conversation = getActiveChat();

  if (!conversation) return;

  if (!conversation.messages.length) {
    const welcome = document.createElement("div");
    welcome.className = "welcome";
    welcome.innerHTML =
      "<h2>✦ SENKO <span>AI</span></h2>" +
      "<p>halo kaka! ada yang bisa senko bantu?</p>";

    chat.appendChild(welcome);
    return;
  }

  conversation.messages.forEach(message => {
    const el = document.createElement("div");
    el.className = "msg " + message.type;

    if (message.text) {
      const content = document.createElement("div");
      content.className = "msg-content";

      if (message.type === "ai") {
        const parsed = marked.parse(message.text);

        content.innerHTML = DOMPurify.sanitize(parsed);

        content.querySelectorAll("pre code").forEach(block => {
          hljs.highlightElement(block);
        });

        content.querySelectorAll("a").forEach(link => {
          link.target = "_blank";
          link.rel = "noopener noreferrer";
        });

      } else {
        content.textContent = message.text;
      }

      el.appendChild(content);
    }

    const imageSrc = message.id
      ? temporaryImages.get(message.id)
      : null;

    if (imageSrc) {
      const img = document.createElement("img");
      img.src = imageSrc;
      img.className = "msg-image";
      img.alt = "Gambar pengguna";
      el.appendChild(img);
    }

    chat.appendChild(el);
  });

  chat.scrollTop = chat.scrollHeight;
}

function renderHistory() {
  historyList.innerHTML = "";

  [...conversations]
    .sort((a, b) => b.updatedAt - a.updatedAt)
    .forEach(conversation => {
      const item = document.createElement("div");
      item.className = "history-item";

      const open = document.createElement("button");
      open.className = "history-open";
      open.textContent = conversation.title;

      open.onclick = () => {
        activeChatId = conversation.id;
        renderMessages();
        historyPanel.classList.remove("show");
      };

      const remove = document.createElement("button");
      remove.className = "history-delete";
      remove.textContent = "✕";

      remove.onclick = () => {
        if (!confirm("Hapus percakapan ini?")) return;

        conversations = conversations.filter(
          c => c.id !== conversation.id
        );

        if (activeChatId === conversation.id) {
          activeChatId = null;
        }

        saveChats();

        if (!activeChatId) {
          createNewChat();
        } else {
          renderMessages();
          renderHistory();
        }
      };

      item.append(open, remove);
      historyList.appendChild(item);
    });
}

// ==================================
// AUTH UI
// ==================================

function updateAuthUI() {
  imageBtn.disabled = !authReady;

  if (currentUser) {
    accountStatus.textContent =
      "Login sebagai: " + currentUser.email;

    authForm.style.display = "none";
    logoutBtn.style.display = "inline-block";

    imageBtn.title = "Kirim gambar";

  } else {
    accountStatus.textContent =
      "Mode tamu • Login untuk menggunakan gambar";

    authForm.style.display = "block";
    logoutBtn.style.display = "none";

    imageBtn.title = "Login untuk mengirim gambar";
  }
}

// ==================================
// AUTH INITIALIZATION
// ==================================

async function checkLogin() {
  try {
    const { data, error } =
      await supabaseClient.auth.getSession();

    if (error) throw error;

    currentUser = data.session?.user || null;

  } catch (error) {
    authMessage.textContent = error.message;
  }

  authReady = true;
  updateAuthUI();
  loadChats();
}

supabaseClient.auth.onAuthStateChange(
  (event, session) => {
    if (event === "INITIAL_SESSION") return;

    const previousId = currentUser?.id || null;
    const nextId = session?.user?.id || null;

    if (previousId === nextId) return;

    currentUser = session?.user || null;

    selectedImage = null;
    selectedMimeType = null;
    previewImage.src = "";
    previewArea.classList.remove("show");

    updateAuthUI();
    loadChats();
  }
);

// ==================================
// REGISTER
// ==================================

async function registerAccount() {
  const username = $("usernameInput").value.trim();
  const email = $("emailInput").value.trim();
  const password = $("passwordInput").value;

  if (!username || !email || !password) {
    authMessage.textContent =
      "Isi username, email, dan password.";
    return;
  }

  if (password.length < 6) {
    authMessage.textContent =
      "Password minimal 6 karakter.";
    return;
  }

  authMessage.textContent = "Membuat akun...";

  const { data, error } =
    await supabaseClient.auth.signUp({
      email,
      password,
      options: {
        data: { username }
      }
    });

  if (error) {
    authMessage.textContent = error.message;
    return;
  }

  if (data.session) {
    currentUser = data.user;
    updateAuthUI();
    loadChats();

    authMessage.textContent =
      "Akun berhasil dibuat!";

  } else {
    authMessage.textContent =
      "Pendaftaran berhasil. Periksa email untuk verifikasi.";
  }
}

// ==================================
// LOGIN
// ==================================

async function loginAccount() {
  const email = $("emailInput").value.trim();
  const password = $("passwordInput").value;

  if (!email || !password) {
    authMessage.textContent =
      "Masukkan email dan password.";
    return;
  }

  authMessage.textContent = "Sedang login...";

  const { data, error } =
    await supabaseClient.auth.signInWithPassword({
      email,
      password
    });

  if (error) {
    authMessage.textContent = error.message;
    return;
  }

  currentUser = data.user;
  updateAuthUI();
  loadChats();

  authMessage.textContent = "Login berhasil!";
}

// ==================================
// LOGOUT
// ==================================

async function logoutAccount() {
  const { error } =
    await supabaseClient.auth.signOut();

  if (error) {
    authMessage.textContent = error.message;
    return;
  }

  currentUser = null;
  selectedImage = null;
  selectedMimeType = null;

  previewImage.src = "";
  previewArea.classList.remove("show");

  updateAuthUI();
  loadChats();

  authMessage.textContent = "Berhasil logout.";
}

// ==================================
// IMAGE UPLOAD
// ==================================

imageBtn.addEventListener("click", () => {
  if (!authReady) return;

  if (!currentUser) {
    alert(
      "🔒 Login dahulu untuk mengirim gambar."
    );

    accountPanel.classList.add("show");
    return;
  }

  const choice = confirm(
    "OK = Galeri\nBatal = Kamera"
  );

  if (choice) imageInput.click();
  else cameraInput.click();
});

function handleImage(file) {
  if (!currentUser) {
    alert("Login dahulu.");
    return;
  }

  if (!file) return;

  const allowed = [
    "image/jpeg",
    "image/png",
    "image/webp"
  ];

  if (!allowed.includes(file.type)) {
    alert("Format harus JPG, PNG, atau WEBP.");
    return;
  }

  // Batas dibuat kecil agar request tidak
  // melewati batas payload serverless.
  if (file.size > 3 * 1024 * 1024) {
    alert("Ukuran gambar maksimal 3 MB.");
    return;
  }

  const reader = new FileReader();

  reader.onload = () => {
    const dataUrl = reader.result;

    selectedImage = dataUrl.split(",")[1];
    selectedMimeType = file.type;

    previewImage.src = dataUrl;
    previewArea.classList.add("show");
  };

  reader.onerror = () => {
    alert("Gagal membaca gambar.");
  };

  reader.readAsDataURL(file);
}

imageInput.addEventListener("change", e => {
  handleImage(e.target.files[0]);
  e.target.value = "";
});

cameraInput.addEventListener("change", e => {
  handleImage(e.target.files[0]);
  e.target.value = "";
});

$("removeImage").addEventListener("click", () => {
  selectedImage = null;
  selectedMimeType = null;

  previewImage.src = "";
  previewArea.classList.remove("show");
});

// ==================================
// SENKO AI ENGINE
// ==================================

async function ask() {
  if (!authReady || sending) return;

  const message = input.value.trim();

  if (!message && !selectedImage) return;

  if (selectedImage && !currentUser) {
    alert("Login dahulu untuk mengirim gambar.");
    return;
  }

  let conversation = getActiveChat();

  if (!conversation) {
    createNewChat();
    conversation = getActiveChat();
  }

  const currentId = conversation.id;

  // Ambil riwayat sebelum pesan baru.
  const history = conversation.messages
    .slice(-12)
    .map(item => ({
      role: item.type === "ai" ? "model" : "user",
      text: item.text || ""
    }));

  const imageToSend = selectedImage;
  const mimeToSend = selectedMimeType;

  const imagePreview = imageToSend
    ? `data:${mimeToSend};base64,${imageToSend}`
    : null;

  input.value = "";
  selectedImage = null;
  selectedMimeType = null;

  previewImage.src = "";
  previewArea.classList.remove("show");

  const userMessage = {
    id: crypto.randomUUID(),
    type: "user",
    text: message
  };

  if (imagePreview) {
    temporaryImages.set(
      userMessage.id,
      imagePreview
    );
  }

  conversation.messages.push(userMessage);

  if (conversation.title === "Percakapan baru") {
    conversation.title =
      (message || "Gambar").slice(0, 35);
  }

  conversation.updatedAt = Date.now();

  saveChats();
  renderMessages();
  renderHistory();

  sending = true;
  send.disabled = true;

  const loading = document.createElement("div");
  loading.className = "msg ai typing";
  loading.textContent = "senko sedang mengetik...";

  if (activeChatId === currentId) {
    chat.appendChild(loading);
    chat.scrollTop = chat.scrollHeight;
  }

  try {
    const headers = {
      "Content-Type": "application/json"
    };

    if (currentUser) {
      const { data, error } =
        await supabaseClient.auth.getSession();

      if (error || !data.session?.access_token) {
        throw new Error("Sesi login berakhir. Login kembali.");
      }

      headers.Authorization =
        "Bearer " + data.session.access_token;
    }

    const response = await fetch("/api/chat", {
      method: "POST",
      headers,
      body: JSON.stringify({
        message,
        userId: currentUser?.id || guestId,
        isGuest: !currentUser,
        history,

        image: imageToSend
          ? {
