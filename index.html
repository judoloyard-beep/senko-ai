
<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Senko AI</title>

<style>
* { box-sizing: border-box; }

body {
  margin: 0;
  background: #0b0d14;
  color: white;
  font-family: Arial, sans-serif;
  height: 100dvh;
  display: flex;
  flex-direction: column;
}

header {
  padding: 15px;
  background: #121522;
  border-bottom: 1px solid #25283a;
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 8px;
}

.logo {
  font-size: 21px;
  font-weight: bold;
}

.logo span { color: #8b7cff; }

.header-buttons {
  display: flex;
  gap: 7px;
}

button {
  border: 0;
  border-radius: 10px;
  padding: 11px 13px;
  background: #7868ff;
  color: white;
  font-weight: bold;
  cursor: pointer;
}

#historyPanel {
  display: none;
  background: #121522;
  border-bottom: 1px solid #25283a;
  padding: 12px;
  max-height: 230px;
  overflow-y: auto;
}

#historyPanel.show { display: block; }

.history-title {
  font-size: 13px;
  color: #aaa;
  margin-bottom: 10px;
}

.history-item {
  display: flex;
  gap: 8px;
  margin-bottom: 7px;
}

.history-open {
  flex: 1;
  min-width: 0;
  text-align: left;
  background: #202438;
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
}

.history-delete {
  background: #a33c50;
}

#chat {
  flex: 1;
  overflow-y: auto;
  padding: 20px;
  display: flex;
  flex-direction: column;
  gap: 15px;
}

.msg {
  padding: 13px 16px;
  border-radius: 15px;
  max-width: 85%;
  line-height: 1.5;
  white-space: pre-wrap;
  overflow-wrap: anywhere;
}

.user {
  background: #6254dc;
  align-self: flex-end;
}

.ai {
  background: #191d2b;
  align-self: flex-start;
}

footer {
  padding: 15px;
  display: flex;
  gap: 8px;
  background: #121522;
}

input {
  flex: 1;
  min-width: 0;
  padding: 14px;
  border-radius: 12px;
  border: 1px solid #34384c;
  background: #1c2030;
  color: white;
  font-size: 15px;
}

button:disabled {
  opacity: 0.5;
}
</style>
</head>

<body>

<header>
  <div class="logo">✦ <span>SENKO</span> AI</div>

  <div class="header-buttons">
    <button id="historyBtn">☰</button>
    <button id="newChatBtn">＋ Chat</button>
  </div>
</header>

<section id="historyPanel">
  <div class="history-title">RIWAYAT PERCAKAPAN</div>
  <div id="historyList"></div>
</section>

<main id="chat"></main>

<footer>
  <input id="input" placeholder="Tanyakan sesuatu..." autocomplete="off">
  <button id="send">Kirim</button>
</footer>

<script>
const chat = document.getElementById('chat');
const input = document.getElementById('input');
const send = document.getElementById('send');
const historyPanel = document.getElementById('historyPanel');
const historyList = document.getElementById('historyList');

const CHAT_KEY = 'senko_chats_v1';

let userId = localStorage.getItem('senko_user_id');

if (!userId) {
  userId = crypto.randomUUID();
  localStorage.setItem('senko_user_id', userId);
}

let conversations = [];

try {
  conversations = JSON.parse(
    localStorage.getItem(CHAT_KEY) || '[]'
  );

  if (!Array.isArray(conversations)) {
    conversations = [];
  }
} catch {
  conversations = [];
}

let activeChatId = null;

function saveChats() {
  try {
    localStorage.setItem(
      CHAT_KEY,
      JSON.stringify(conversations)
    );
    return true;
  } catch (error) {
    alert('Penyimpanan penuh atau tidak tersedia.');
    return false;
  }
}

function getActiveChat() {
  return conversations.find(c => c.id === activeChatId);
}

// Membuat percakapan baru
function newChat() {
  const conversation = {
    id: crypto.randomUUID(),
    title: 'Percakapan baru',
    updatedAt: Date.now(),
    messages: []
  };

  conversations.unshift(conversation);
  activeChatId = conversation.id;

  saveChats();
  renderMessages();
  renderHistory();

  historyPanel.classList.remove('show');
}

// Menampilkan pesan
function renderMessages() {
  chat.innerHTML = '';

  const conversation = getActiveChat();
  if (!conversation) return;

  conversation.messages.forEach(message => {
    const el = document.createElement('div');
    el.className = 'msg ' + message.type;
    el.textContent = message.text;
    chat.appendChild(el);
  });

  chat.scrollTop = chat.scrollHeight;
}

// Menampilkan daftar riwayat
function renderHistory() {
  historyList.innerHTML = '';

  const sorted = [...conversations].sort(
    (a, b) => b.updatedAt - a.updatedAt
  );

  sorted.forEach(conversation => {
    const item = document.createElement('div');
    item.className = 'history-item';

    const open = document.createElement('button');
    open.className = 'history-open';
    open.textContent = conversation.title;

    open.onclick = () => {
      activeChatId = conversation.id;
      renderMessages();
      historyPanel.classList.remove('show');
    };

    const remove = document.createElement('button');
    remove.className = 'history-delete';
    remove.textContent = '✕';

    remove.onclick = () => {
      if (!confirm('Hapus percakapan ini?')) return;

      conversations = conversations.filter(
        c => c.id !== conversation.id
      );

      saveChats();

      if (activeChatId === conversation.id) {
        activeChatId = null;

        if (conversations.length) {
          activeChatId = conversations[0].id;
        } else {
          newChat();
        }
      }

      renderMessages();
      renderHistory();
    };

    item.appendChild(open);
    item.appendChild(remove);
    historyList.appendChild(item);
  });
}

// Mengirim pesan ke AI
async function ask() {
  const message = input.value.trim();

  if (!message || send.disabled) return;

  let conversation = getActiveChat();

  if (!conversation) {
    newChat();
    conversation = getActiveChat();
  }

  const currentId = conversation.id;

  input.value = '';

  conversation.messages.push({
    text: message,
    type: 'user'
  });

  if (conversation.title === 'Percakapan baru') {
    conversation.title = message.slice(0, 35);
  }

  conversation.updatedAt = Date.now();

  saveChats();
  renderMessages();
  renderHistory();

  const loading = document.createElement('div');
  loading.className = 'msg ai';
  loading.textContent = 'Senko sedang berpikir...';
  chat.appendChild(loading);

  send.disabled = true;

  try {
    const res = await fetch('/api/chat', {
      method: 'POST',
      headers: {
        'Content-Type': 'application/json'
      },
      body: JSON.stringify({
        message: message,
        userId: userId
      })
    });

    const data = await res.json();

    if (!res.ok) {
      throw new Error(data.error || 'Terjadi kesalahan');
    }

    conversation.messages.push({
      text: data.reply,
      type: 'ai'
    });

  } catch (error) {
    conversation.messages.push({
      text: 'Gagal: ' + error.message,
      type: 'ai'
    });
  } finally {
    conversation.updatedAt = Date.now();

    saveChats();
    renderHistory();

    if (activeChatId === currentId) {
      renderMessages();
    }

    send.disabled = false;
    input.focus();
  }
}

// Tombol
document.getElementById('newChatBtn')
  .addEventListener('click', newChat);

document.getElementById('historyBtn')
  .addEventListener('click', () => {
    historyPanel.classList.toggle('show');
  });

send.addEventListener('click', ask);

input.addEventListener('keydown', e => {
  if (e.key === 'Enter') ask();
});

// Memuat percakapan terakhir
if (conversations.length) {
  activeChatId = [...conversations].sort(
    (a, b) => b.updatedAt - a.updatedAt
  )[0].id;

  renderMessages();
  renderHistory();
} else {
  newChat();
}
</script>

</body>
</html>
