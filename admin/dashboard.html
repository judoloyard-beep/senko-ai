<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Senko AI Admin</title>

<style>
*{box-sizing:border-box;margin:0;padding:0}
body{background:#090d18;color:#f1f5f9;font-family:Arial,sans-serif}
.sidebar{background:#101729;padding:25px;border-bottom:1px solid #263149}
.brand{font-size:23px;font-weight:bold}
.brand span{color:#8b7cff}
.main{padding:25px;max-width:1100px;margin:auto}
.top{display:flex;justify-content:space-between;align-items:center;margin-bottom:28px}
button{border:0;border-radius:8px;padding:10px 15px;background:#7566e9;color:white;cursor:pointer}
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;margin:20px 0}
.card,.chat{background:#131c30;border:1px solid #27334b;border-radius:13px;padding:18px}
small,.muted{color:#9aa8bf}
.number{font-size:29px;font-weight:bold;margin-top:12px}
h2{font-size:19px;margin-bottom:16px}
.chat{margin-bottom:13px;overflow-wrap:anywhere}
.chathead{display:flex;justify-content:space-between;gap:10px;margin-bottom:15px;flex-wrap:wrap}
.message{background:#1c2940;padding:12px;border-radius:9px;margin-top:8px;white-space:pre-wrap}
.reply{background:#252044}
.label{font-size:12px;color:#a99cff;margin-bottom:6px}
#error{color:#fb7185;margin-top:12px}
#empty{color:#9aa8bf;padding:20px 0}
@media(max-width:600px){
 .grid{grid-template-columns:1fr}
 .main{padding:17px}
}
</style>
</head>

<body>

<header class="sidebar">
  <div class="brand">SENKO <span>AI</span></div>
  <small>Admin Control Panel</small>
</header>

<main class="main">

  <div class="top">
    <div>
      <h1>Dashboard</h1>
      <small>Pengelolaan Senko AI</small>
    </div>
    <button id="logoutBtn">Logout</button>
  </div>

  <h2>Statistik</h2>

  <div class="grid">
    <div class="card">
      <small>Total pengguna</small>
      <div class="number" id="totalUsers">--</div>
    </div>

    <div class="card">
      <small>Total percakapan</small>
      <div class="number" id="totalChats">--</div>
    </div>

    <div class="card">
      <small>Total memori</small>
      <div class="number" id="totalMemories">--</div>
    </div>
  </div>

  <section style="margin-top:35px">
    <h2>Riwayat Percakapan</h2>
    <small>50 percakapan terbaru</small>

    <div id="history" style="margin-top:18px">
      <p id="empty">Memuat riwayat...</p>
    </div>

    <p id="error"></p>
  </section>

</main>

<script>
async function checkAdmin(){
  try{
    const response=await fetch("/api/admin/verify",{
      credentials:"same-origin",
      cache:"no-store"
    });

    const data=await response.json();

    if(!response.ok||!data.authenticated){
      location.replace("/admin.html");
      return false;
    }

    return true;
  }catch{
    location.replace("/admin.html");
    return false;
  }
}

async function loadStats(){
  const response=await fetch("/api/admin/stats",{
    credentials:"same-origin",
    cache:"no-store"
  });

  if(!response.ok) throw new Error("Statistik gagal dimuat");

  const data=await response.json();

  document.getElementById("totalUsers").textContent=data.totalUsers??"--";
  document.getElementById("totalChats").textContent=data.totalChats??"--";
  document.getElementById("totalMemories").textContent=data.totalMemories??"--";
}

function addText(parent,tag,className,value){
  const element=document.createElement(tag);
  element.className=className;
  element.textContent=value;
  parent.appendChild(element);
  return element;
}

async function loadHistory(){
  const response=await fetch("/api/admin/history",{
    credentials:"same-origin",
    cache:"no-store"
  });

  if(!response.ok) throw new Error("Riwayat chat gagal dimuat");

  const data=await response.json();
  const container=document.getElementById("history");
  container.replaceChildren();

  if(!data.chats||data.chats.length===0){
    addText(container,"p","muted","Belum ada percakapan.");
    return;
  }

  data.chats.forEach(chat=>{
    const card=document.createElement("article");
    card.className="chat";

    const date=chat.created_at
      ?new Date(chat.created_at).toLocaleString("id-ID")
      :"Tanggal tidak tersedia";

    addText(card,"div","chathead","Percakapan • "+date);

    addText(card,"div","label","PENGGUNA");
    addText(card,"div","message",chat.user_message||"");

    addText(card,"div","label","SENKO AI");
    addText(card,"div","message reply",chat.assistant_reply||"");

    container.appendChild(card);
  });
}

document.getElementById("logoutBtn").addEventListener("click",async()=>{
  await fetch("/api/admin/logout",{
    method:"POST",
    credentials:"same-origin"
  });

  location.replace("/admin.html");
});

async function startDashboard(){
  if(!await checkAdmin()) return;

  try{
    await Promise.all([loadStats(),loadHistory()]);
  }catch(error){
    document.getElementById("error").textContent=error.message;
  }
}

startDashboard();
</script>

</body>
</html>
